name: Validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the authoring standard
        run: node scripts/validate-skills.mjs

      - name: Re-running the split changes nothing
        run: |
          # The splitter appends a routing table. When it was not idempotent a
          # second pass left the old table in place and added a longer one
          # below it, which corrupted three skills before anyone noticed.
          BEFORE=$(find skills -name '*.md' -exec md5sum {} + | sort | md5sum)
          node scripts/split-skill.mjs > /dev/null
          AFTER=$(find skills -name '*.md' -exec md5sum {} + | sort | md5sum)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "split-skill.mjs is not idempotent — re-running it changed files"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Scripts are syntactically valid
        run: |
          for f in $(find . -name '*.mjs' -not -path './node_modules/*'); do
            node --check "$f"
          done

      - name: Scripts run and self-describe
        run: |
          node skills/wp-security-audit/scripts/wp-scan.mjs --help
          node skills/wp-project-analyze/scripts/wp-detect.mjs || true
          for s in serve assemble fetch-fonts novamira capture gate3 gate4 gate5-elementor elementor-data; do
            node skills/wp-site-build/scripts/$s.mjs --help
          done

      - name: Assembler builds its fixture, and refuses a broken menu
        run: |
          F=/tmp/mockup
          mkdir -p $F/source/parts $F/source/pages
          echo '<title>{{title}}</title><body class="{{class}}">{{banner}}{{header}}<main>{{content}}</main>{{footer}}</body>' > $F/source/head.html
          echo '<ul><li data-menu="Home"><a href="index.html">Home</a></li></ul>' > $F/source/parts/header.html
          echo '<footer>f</footer>' > $F/source/parts/footer.html
          printf '<!-- file: index.html | title: Home | class: home | menu: Home -->\n<h1>Hi</h1>\n' > $F/source/pages/home.html
          node skills/wp-site-build/scripts/assemble.mjs $F
          grep -q 'class="is-current"' $F/site/index.html
          grep -q 'aria-current="page"' $F/site/index.html
          printf '<!-- file: shop.html | title: Shop | menu: Shop -->\n<p>x</p>\n' > $F/source/pages/shop.html
          # Exit 1 is the expected outcome: "Shop" is not in the header.
          if node skills/wp-site-build/scripts/assemble.mjs $F; then
            echo "assemble.mjs accepted a menu entry that does not exist"
            exit 1
          fi

      - name: Elementor data check passes a valid page, and refuses an html widget
        run: |
          D=/tmp/elementor
          mkdir -p $D
          # Built with the module's own builders, so the fixture follows the format it checks.
          node --input-type=module -e "
            import fs from 'node:fs';
            import { container, heading, image, button, finalise, resetIds } from './skills/wp-site-build/scripts/elementor-data.mjs';
            resetIds('t');
            const ok = finalise([container('hero', [
              heading('Hello', 'h1', 'hero__title'),
              image('hero.jpg', 'A photo', 'hero__photo'),
              container('hero__actions', [button('Ask for a quote', '@page:quote', 'pill')], { row: true }),
            ], { tag: 'section' })]);
            fs.writeFileSync('$D/ok.json', JSON.stringify(ok));
            const bad = structuredClone(ok);
            bad[0].elements.push({ id: 'zz00001', elType: 'widget', widgetType: 'html', isInner: false, settings: { html: '<div></div>' }, elements: [] });
            fs.writeFileSync('$D/bad.json', JSON.stringify(bad));
          "
          node skills/wp-site-build/scripts/elementor-data.mjs check $D/ok.json
          # Exit 1 is the expected outcome: an html widget is never allowed.
          if node skills/wp-site-build/scripts/elementor-data.mjs check $D/bad.json; then
            echo "elementor-data.mjs accepted an html widget"
            exit 1
          fi

      - name: Scanner fires on its fixture
        run: |
          mkdir -p /tmp/fixture
          cat > /tmp/fixture/vuln.php <<'PHP'
          <?php
          add_action( 'wp_ajax_nopriv_demo', 'demo_cb' );
          function demo_cb() {
              global $wpdb;
              $wpdb->query( $wpdb->prepare( "UPDATE x SET a = '" . $_POST['v'] . "'" ) );
          }
          PHP
          # Exit 1 is the expected outcome: the scanner found the planted bugs.
          if node skills/wp-security-audit/scripts/wp-scan.mjs /tmp/fixture --min-severity critical; then
            echo "scanner failed to detect the planted vulnerabilities"
            exit 1
          fi
